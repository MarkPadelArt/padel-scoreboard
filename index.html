<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel Art &middot; Court Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020403;
    --bg2:#0A0F0B;
    --lime:#8CC63F;
    --lime-bright:#A6E22E;
    --white:#F5F7F3;
    --gold:#F0B429;
    --silver:#AFC0BC;
    --bronze:#C97B4A;
    --ink:#050805;
    font-family:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(140,198,63,0.03) 39px, rgba(140,198,63,0.03) 40px);
    color:var(--white);
    min-height:100vh;
  }
  .wrap{max-width:1300px;margin:0 auto;padding:24px 20px 80px;}

  /* ---- header ---- */
  header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:16px;margin-bottom:22px;padding-bottom:18px;
    border-bottom:3px dashed rgba(140,198,63,0.3);
  }
  .brandrow{display:flex;align-items:center;gap:14px;flex:1;min-width:260px;}
  .brandrow img{height:52px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(140,198,63,0.25));}
  .titleblock{flex:1;}
  .eyebrow{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.18em;
    color:var(--lime-bright);text-transform:uppercase;margin:0 0 4px;
  }
  #category{
    font-family:'Archivo Black',sans-serif;font-size:clamp(32px,5.5vw,58px);
    line-height:1.02;color:var(--white);background:transparent;border:none;
    border-bottom:2px solid transparent;width:100%;padding:2px 0;
  }
  #category:focus{outline:none;border-bottom:2px solid var(--lime-bright);}
  .headctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  button{
    font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;
    border:none;border-radius:8px;padding:10px 14px;cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-lime{background:var(--lime-bright);color:var(--ink);}
  .btn-lime:hover{filter:brightness(1.08);}
  .btn-ghost{background:rgba(245,247,243,0.08);color:var(--white);border:1px solid rgba(140,198,63,0.3);}
  .btn-ghost:hover{background:rgba(140,198,63,0.15);}
  .btn-clay{background:var(--bronze);color:var(--ink);}

  .roundctrl{
    display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;
    font-size:13px;color:var(--white);background:rgba(140,198,63,0.08);
    border-radius:8px;padding:6px 10px;
  }
  .roundctrl button{padding:4px 10px;font-size:14px;border-radius:6px;}

  .zoomctrl{
    display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;
    font-size:12px;color:var(--white);background:rgba(140,198,63,0.08);
    border-radius:8px;padding:6px 8px;
  }
  .zoomctrl button{padding:4px 10px;font-size:14px;border-radius:6px;}
  .syncdot{
    font-family:'Space Mono',monospace;font-size:11px;padding:8px 10px;border-radius:8px;
    background:rgba(140,198,63,0.08);white-space:nowrap;
  }
  .syncdot.ok{color:var(--lime-bright);}
  .syncdot.warn{color:#E0B23B;}
  .syncdot.err{color:#E0603B;}

  .hide-on-tv-idle{transition:opacity .4s ease;}
  body.tv.controls-hidden .hide-on-tv-idle{opacity:0;pointer-events:none;}
  body.tv header{transition:padding .3s ease;}
  #zoomLabel{min-width:42px;text-align:center;}

  /* ---- zoomable table stage ---- */
  #tvStage{
    zoom:1;
    -moz-transform:scale(1); -moz-transform-origin: top left; /* firefox fallback, imperfect */
  }
  .tablewrap{overflow-x:auto;border-radius:12px;background:rgba(140,198,63,0.03);border:1px solid rgba(140,198,63,0.12);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:rgba(245,247,243,0.5);
    text-align:center;padding:10px 6px;border-bottom:2px solid rgba(140,198,63,0.2);
  }
  th.teamcol{text-align:left;padding-left:14px;}
  td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(140,198,63,0.08);}
  tr.row{transition:background .2s ease;}
  tr.rank-1{background:linear-gradient(90deg, rgba(240,180,41,0.20), transparent 70%);}
  tr.rank-2{background:linear-gradient(90deg, rgba(175,192,188,0.14), transparent 70%);}
  tr.rank-3{background:linear-gradient(90deg, rgba(201,123,74,0.14), transparent 70%);}
  .rankcell{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;width:52px;}
  .medal{font-size:16px;}
  .teamname{
    text-align:left;padding-left:14px;font-weight:700;font-size:22px;color:var(--white);
    background:transparent;border:none;width:100%;font-family:'DM Sans',sans-serif;
  }
  .teamname:focus{outline:none;}
  input.score{
    width:56px;text-align:center;font-family:'Space Mono',monospace;font-size:20px;
    background:rgba(140,198,63,0.08);border:1px solid rgba(140,198,63,0.2);
    border-radius:6px;color:var(--white);padding:8px 2px;
  }
  input.score:focus{outline:none;border-color:var(--lime-bright);}
  .total{
    font-family:'Space Mono',monospace;font-weight:700;font-size:26px;color:var(--lime-bright);
    min-width:64px;
  }
  .rmteam{background:none;border:none;color:rgba(245,247,243,0.3);cursor:pointer;font-size:16px;padding:2px 6px;}
  .rmteam:hover{color:var(--bronze);}

  .footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:10px;}
  .hint{font-family:'Space Mono',monospace;font-size:12px;color:rgba(245,247,243,0.4);}

  /* ---- TV mode ---- */
  body.tv .editctrls, body.tv .rmteam, body.tv input.score{display:none !important;}
  body.tv .score-display{display:inline-block !important;font-size:1.3em;font-weight:700;color:var(--lime-bright);}
  body.tv th, body.tv .teamname{font-size:1.3em;}
  body.tv .total{font-size:1.45em;}
  body.tv header{border-bottom:3px dashed rgba(140,198,63,0.4);}
  body.tv #category{font-size:clamp(38px,6.5vw,68px);}
  .score-display{display:none;font-family:'Space Mono',monospace;font-size:20px;}

  /* ---- reveal overlay ---- */
  #reveal{
    position:fixed;inset:0;background:#000;
    display:none;align-items:flex-start;justify-content:center;
    z-index:50;cursor:pointer;padding:5vh 5vw;overflow:auto;
    background-image:repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(140,198,63,0.04) 39px, rgba(140,198,63,0.04) 40px);
  }
  #reveal.show{display:flex;}
  .reveal-stage{width:100%;max-width:1200px;opacity:0;text-align:left;transform-origin:top center;transition:transform .15s ease;}
  .reveal-anim .reveal-stage{animation:fadeInOnly .5s ease forwards;}
  .reveal-header{display:flex;align-items:center;gap:20px;margin-bottom:36px;}
  .reveal-header img{height:64px;width:auto;filter:drop-shadow(0 0 10px rgba(140,198,63,0.3));}
  .reveal-eyebrow{
    font-family:'Space Mono',monospace;letter-spacing:.25em;text-transform:uppercase;
    color:var(--lime-bright);font-size:14px;margin-bottom:6px;
  }
  .reveal-title{
    font-family:'Archivo Black',sans-serif;font-size:clamp(34px,5vw,64px);
    color:var(--white);line-height:1.05;
  }
  .reveal-divider{border-top:2px dashed rgba(140,198,63,0.35);margin-bottom:26px;}
  .reveal-table{width:100%;border-collapse:collapse;}
  .reveal-table th{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.15em;text-transform:uppercase;
    color:rgba(245,247,243,0.45);padding:10px 14px;text-align:center;
  }
  .reveal-table th:first-child, .reveal-table th:nth-child(2){text-align:left;}
  .reveal-table td{
    font-family:'DM Sans',sans-serif;font-weight:700;color:var(--white);
    padding:14px;font-size:18px;text-align:center;
  }
  .reveal-table td.reveal-rankcell{
    font-family:'Space Mono',monospace;width:70px;color:rgba(245,247,243,0.7);text-align:left;
  }
  .reveal-table td.reveal-name{text-align:left;}
  .reveal-table td.score-cell{font-family:'Space Mono',monospace;color:var(--lime-bright);}
  .reveal-table td.reveal-total{font-family:'Space Mono',monospace;font-weight:700;color:var(--lime-bright);}
  .reveal-table tr:nth-child(even){background:rgba(245,247,243,0.025);}
  .reveal-table tr.rank-1{background:linear-gradient(90deg, rgba(224,178,59,0.16), transparent 70%);}
  .reveal-table tr.rank-2{background:linear-gradient(90deg, rgba(200,205,214,0.12), transparent 70%);}
  .reveal-table tr.rank-3{background:linear-gradient(90deg, rgba(196,120,74,0.14), transparent 70%);}
  .reveal-table tr.top3 td{font-size:21px;padding:17px 14px;}
  .reveal-controls{margin-top:26px;display:flex;gap:12px;transition:opacity .3s ease;}
  .reveal-controls.controls-hidden{opacity:0;pointer-events:none;}
  .reveal-zoom{
    position:fixed;bottom:24px;right:24px;display:flex;gap:8px;z-index:52;
  }
  .reveal-zoom button{
    width:44px;height:44px;font-size:20px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .flash-zoom{transition:opacity .3s ease;}
  .flash-zoom.controls-hidden{opacity:0;pointer-events:none;}
  .reveal-hint{position:absolute;bottom:26px;font-family:'Space Mono',monospace;font-size:12px;color:rgba(245,247,243,0.4);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeInOnly{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .reveal-anim *{animation:none !important;opacity:1 !important;transform:none !important;}
  }

  /* ---- matchup editor panel ---- */
  #matchupPanel{
    margin:0 0 22px;padding:16px;border-radius:12px;
    background:rgba(140,198,63,0.05);border:1px solid rgba(140,198,63,0.15);
  }
  .flash-brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px;opacity:0;}
  .flash-brand img{height:44px;width:auto;display:block;filter:drop-shadow(0 0 8px rgba(140,198,63,0.25));}
  .flash-brand .fb-name{font-family:'Archivo Black',sans-serif;font-size:clamp(20px,3vw,30px);color:var(--white);line-height:1.05;}
  .matchup-head{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .courtrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(140,198,63,0.08);flex-wrap:wrap;}
  .courtrow:last-child{border-bottom:none;}
  .courtlabel{
    font-family:'Space Mono',monospace;font-size:13px;color:var(--lime-bright);width:90px;flex-shrink:0;
    background:rgba(140,198,63,0.08);border:1px solid rgba(140,198,63,0.25);border-radius:6px;padding:8px 8px;
  }
  .courtlabel::placeholder{color:rgba(140,198,63,0.4);}
  .courtrow .matchup-input{
    flex:1;min-width:0;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
    background:rgba(245,247,243,0.06);color:var(--white);border:1px solid rgba(140,198,63,0.25);
    border-radius:6px;padding:8px 10px;
  }
  .courtrow .matchup-input::placeholder{color:rgba(245,247,243,0.35);}
  .courtrow .vs{font-family:'Space Mono',monospace;font-size:12px;color:rgba(245,247,243,0.4);flex-shrink:0;}
  .courtrow .matchup-score{
    width:44px;flex-shrink:0;text-align:center;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;
    background:rgba(140,198,63,0.1);color:var(--lime-bright);border:1px solid rgba(140,198,63,0.3);
    border-radius:6px;padding:8px 2px;
  }
  .pairgroup{display:flex;flex-direction:column;gap:6px;flex:1;min-width:110px;}
  .pairgroup .matchup-input{width:100%;}

  /* ---- flash matchups overlay ---- */
  #flash{
    position:fixed;inset:0;background:#000;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    z-index:51;text-align:center;padding:24px;
    background-image:repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(140,198,63,0.04) 39px, rgba(140,198,63,0.04) 40px);
  }
  #flash.show{display:flex;}
  .flashstage{width:100%;max-width:900px;}
  .flash-round{
    font-family:'Space Mono',monospace;letter-spacing:.3em;text-transform:uppercase;
    color:var(--lime-bright);font-size:20px;margin-bottom:24px;opacity:0;
  }
  .flashgrid{display:flex;flex-direction:column;gap:14px;}
  .flashcard{
    border:1px solid rgba(140,198,63,0.3);border-radius:12px;padding:16px 20px;
    background:rgba(140,198,63,0.06);opacity:0;transform:translateY(14px);
  }
  .flashcourt{
    font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.15em;
    color:var(--lime-bright);margin-bottom:8px;
  }
  .flashpair{
    font-family:'Archivo Black',sans-serif;font-size:clamp(22px,4vw,36px);color:var(--white);
    display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  }
  .flashvs{font-family:'Space Mono',monospace;font-size:15px;color:rgba(245,247,243,0.4);}
  .flashscore{font-family:'Space Mono',monospace;color:var(--lime-bright);font-weight:700;}
  .flash-anim .flash-brand{animation:fadeUp .5s ease forwards;}
  .flash-anim .flash-round{animation:fadeUp .5s ease forwards;}
  .flash-anim .flashcard{animation:fadeUp .45s ease forwards;}
  .flash-anim .flashcard:nth-child(1){animation-delay:.1s;}
  .flash-anim .flashcard:nth-child(2){animation-delay:.2s;}
  .flash-anim .flashcard:nth-child(3){animation-delay:.3s;}
  .flash-anim .flashcard:nth-child(4){animation-delay:.4s;}
  .flash-anim .flashcard:nth-child(5){animation-delay:.5s;}
  .flash-anim .flashcard:nth-child(6){animation-delay:.6s;}
  .flash-anim .flashcard:nth-child(n+7){animation-delay:.7s;}
</style>
</head>

        <button class="btn-ghost" onclick="changeCourts(1)">+</button>
      </div>

    <div class="matchup-head">
      <button class="btn-lime" onclick="autoGenerateMatchups()" title="Uses the team names already added on the leaderboard — every player partners with every other player exactly once, and courts are matched up each round to keep opponents varied too.">&#8635; Auto-Generate Matchups</button>
    </div>

  </div>

  <div id="tvStage">
    <div class="tablewrap">
      <table>
        <thead>
          <tr id="headRow">
            <th style="width:52px;">Rank</th>
            <th class="teamcol">Team</th>
            <th style="width:52px;">Total</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

  </div>

  <div class="footer-actions">
    <span class="hint editctrls">Tap a score to edit &middot; scores save automatically &middot; use +/&minus; to zoom the board to fit more teams</span>
    <button class="btn-ghost editctrls" onclick="resetBoard()">Reset board</button>

<div id="reveal" onclick="closeReveal()">

        <div class="reveal-eyebrow">PADEL ART &middot; LEADERBOARD</div>

    <div id="flashCourts" class="flashgrid"></div>

  </div>

<script>
let state = {
  category: "Queen of the Court",
  rounds: 5,
  courts: 3,
  teams: [
    {id:1, name:"Team A", scores:[0,0,0,0,0]},
    {id:2, name:"Team B", scores:[0,0,0,0,0]}
  ],
  matchups: [] // matchups[roundIdx][courtIdx] = {a: teamId|null, b: teamId|null}
};
// boards holds every tournament; state always points at the active tournament's data.
// Kept as one object so the existing Worker/Gist (which just stores one blob) needs no changes.
let boards = { activeId: 'default', tournaments: { default: state } };
let nextId = 3;
let saveTimer = null;
let zoom = 1;
let editRound = 0;   // which round is shown in the matchup editor
let flashRound = 0;  // which round is shown in the flash overlay
let flashZoomLevel = 1;
const WORKER_URL = "https://padel-scoreboard-sync.markmauricefajardo.workers.dev";
const LOCAL_CACHE_KEY = "padelScoreboardCache";
let lastSavedSnapshot = "";

function recalcNextId(){
  nextId = Math.max(0, ...state.teams.map(t=>t.id), 0) + 1;
}

// Accepts whatever we just fetched/parsed from storage and normalizes it into
// the {activeId, tournaments} shape, migrating older single-tournament saves.
function adoptBoards(parsed){
  if(parsed && parsed.tournaments && typeof parsed.tournaments === 'object'){
    boards = parsed;
    if(!boards.tournaments[boards.activeId]) boards.activeId = Object.keys(boards.tournaments)[0];
  } else if(parsed && typeof parsed === 'object'){
    boards = { activeId: 'default', tournaments: { default: parsed } };
  }
  state = boards.tournaments[boards.activeId];
  recalcNextId();
}

function tournamentList(){
  return Object.keys(boards.tournaments).map(id=>({id, label: boards.tournaments[id].category || id}));
}

function renderTournamentSwitcher(){
  const sel = document.getElementById('tournamentSelect');
  if(!sel) return;
  sel.innerHTML = '';
  tournamentList().forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t.id; opt.textContent = t.label;
    if(t.id === boards.activeId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function switchTournament(id){
  if(!boards.tournaments[id]) return;
  boards.activeId = id;
  state = boards.tournaments[id];
  recalcNextId();
  ensureMatchupsShape();
  editRound = 0;
  render();
  renderTournamentSwitcher();
  fitTitle();
  if(document.getElementById('matchupPanel').style.display !== 'none') renderMatchupPanel();
}

function newTournament(){
  const name = prompt('Name for the new tournament:', 'New Tournament');
  if(name === null) return;
  const id = 't' + Date.now();
  boards.tournaments[id] = {
    category: name.trim() || 'New Tournament',
    rounds: 5, courts: 3,
    teams: [], matchups: [], courtNames: []
  };
  switchTournament(id);
  queueSave();
}

function deleteTournament(){
  const ids = Object.keys(boards.tournaments);
  if(ids.length <= 1){ alert('At least one tournament must remain.'); return; }
  if(!confirm('Delete "' + state.category + '" and all its data? This cannot be undone.')) return;
  delete boards.tournaments[boards.activeId];
  const nextActive = Object.keys(boards.tournaments)[0];
  boards.activeId = nextActive;
  switchTournament(nextActive);
  queueSave();
}

function ensureMatchupsShape(){
  if(!state.courts) state.courts = 3;
  if(!state.matchups) state.matchups = [];
  if(!state.courtNames) state.courtNames = [];
  while(state.courtNames.length < state.courts) state.courtNames.push('');
  state.courtNames.length = state.courts;
  state.courtNames.forEach((name,i)=>{
    if(typeof name !== 'string' || !name.trim()) state.courtNames[i] = 'Court ' + (i+1);
  });
  while(state.matchups.length < state.rounds) state.matchups.push([]);
  state.matchups.length = state.rounds;
  state.matchups.forEach(roundArr=>{
    while(roundArr.length < state.courts) roundArr.push({a1:'',a2:'',b1:'',b2:''});
    roundArr.length = state.courts;
    roundArr.forEach(m=>{
      // migrate old single-name shape {a,b} into the new pair shape
      if(typeof m.a === 'string' && typeof m.a1 !== 'string'){ m.a1 = m.a; }
      if(typeof m.b === 'string' && typeof m.b1 !== 'string'){ m.b1 = m.b; }
      delete m.a; delete m.b;
      if(typeof m.a1 !== 'string') m.a1 = '';
      if(typeof m.a2 !== 'string') m.a2 = '';
      if(typeof m.b1 !== 'string') m.b1 = '';
      if(typeof m.b2 !== 'string') m.b2 = '';
    });
  });
  if(editRound >= state.rounds) editRound = Math.max(0, state.rounds-1);
  if(flashRound >= state.rounds) flashRound = Math.max(0, state.rounds-1);
}

function isConfigured(){
  return WORKER_URL && WORKER_URL.indexOf('PASTE_YOUR') === -1;
}

async function fetchBoard(){
  const res = await fetch(WORKER_URL);
  if(!res.ok) throw new Error('bad response: ' + res.status);
  return await res.text();
}

async function saveBoard(newState){
  const body = JSON.stringify(newState);
  // stash a local copy first so nobody loses edits even if this request fails
  try{ localStorage.setItem(LOCAL_CACHE_KEY, body); }catch(e){ /* storage unavailable, ignore */ }
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body
  });
  if(!res.ok) throw new Error('save failed: ' + res.status);
}

function updateSyncStatus(s){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  const map = {
    synced: ['\u25CF Synced', 'ok'],
    connecting: ['\u25CF Connecting\u2026', 'warn'],
    error: ['\u25CF Sync error \u2014 retrying', 'err'],
    unconfigured: ['\u25CF Not connected \u2014 add your Web App URL', 'warn']
  };
  const pair = map[s] || map.error;
  el.textContent = pair[0];
  el.className = 'syncdot ' + pair[1];
}

async function loadState(){
  if(!isConfigured()){
    updateSyncStatus('unconfigured');
    ensureMatchupsShape(); render(); renderTournamentSwitcher(); fitTitle();
    pollLoop();
    return;
  }
  updateSyncStatus('connecting');
  try{
    const value = await fetchBoard();
    if(value && value !== '{}' && value.trim() !== ''){
      adoptBoards(JSON.parse(value));
      lastSavedSnapshot = JSON.stringify(boards);
    }
    updateSyncStatus('synced');
  }catch(e){
    console.error('load failed', e);
    // fall back to the last known local copy so a network hiccup doesn't show a blank board
    try{
      const cached = localStorage.getItem(LOCAL_CACHE_KEY);
      if(cached){
        adoptBoards(JSON.parse(cached));
      }
    }catch(e2){ /* corrupt or unavailable cache, ignore */ }
    updateSyncStatus('error');
    scheduleSyncRetry();
  }
  ensureMatchupsShape();
  render();
  renderTournamentSwitcher();
  fitTitle();
  pollLoop();
}

let syncRetryTimer = null;
function scheduleSyncRetry(){
  clearTimeout(syncRetryTimer);
  syncRetryTimer = setTimeout(async ()=>{
    if(!isConfigured()) return;
    try{
      await saveBoard(boards);
      lastSavedSnapshot = JSON.stringify(boards);
      updateSyncStatus('synced');
    }catch(e){
      updateSyncStatus('error');
      scheduleSyncRetry();  // keep retrying quietly until it goes through
    }
  }, 8000);
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!isConfigured()){ updateSyncStatus('unconfigured'); return; }
    try{
      await saveBoard(boards);
      lastSavedSnapshot = JSON.stringify(boards);
      updateSyncStatus('synced');
      clearTimeout(syncRetryTimer);
    }
    catch(e){ console.error("save failed", e); updateSyncStatus('error'); scheduleSyncRetry(); }
  }, 500);
}

// Quietly check for updates from other devices (e.g. laptop editing while TV displays).
// Only applies when no input on this page is currently focused, so it never
// interrupts someone mid-edit, and it re-renders in place (no page reload/flash).
function pollLoop(){
  setInterval(async ()=>{
    if(!isConfigured()) return;
    const active = document.activeElement;
    const isEditing = active && (active.tagName==='INPUT');
    if(isEditing) return;
    try{
      const value = await fetchBoard();
      if(value && value !== lastSavedSnapshot && value !== '{}' && value.trim() !== ''){
        adoptBoards(JSON.parse(value));
        lastSavedSnapshot = value;
        ensureMatchupsShape();
        render();
        renderTournamentSwitcher();
        fitTitle();
      }
      updateSyncStatus('synced');
    }catch(e){ updateSyncStatus('error'); }
  }, 15000);
}

document.getElementById('category').addEventListener('input', e=>{
  state.category = e.target.value; fitTitle(); queueSave();
  renderTournamentSwitcher();
  const fEl = document.getElementById('flashEventName');
  if(fEl) fEl.textContent = state.category;
});

function fitTitle(){
  const el = document.getElementById('category');
  if(!el) return;
  let size = 42;
  el.style.fontSize = size + 'px';
  while(el.scrollWidth > el.clientWidth + 2 && size > 15){
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}
window.addEventListener('resize', fitTitle);

function changeRounds(delta){
  const n = Math.max(1, Math.min(12, state.rounds + delta));
  state.rounds = n;
  state.teams.forEach(t=>{
    while(t.scores.length < n) t.scores.push(0);
    while(t.scores.length > n) t.scores.pop();
  });
  ensureMatchupsShape();
  render(); queueSave();
}

function changeCourts(delta){
  const n = Math.max(1, Math.min(8, state.courts + delta));
  state.courts = n;
  ensureMatchupsShape();
  renderMatchupPanel(); queueSave();
}

function changeEditRound(delta){
  editRound = Math.max(0, Math.min(state.rounds-1, editRound + delta));
  renderMatchupPanel();
}

function findTeamByName(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  return state.teams.find(t=>t.name.trim().toLowerCase()===n) || null;
}

function updateMatchup(courtIdx, side, value){
  ensureMatchupsShape();
  state.matchups[editRound][courtIdx][side] = value;
  renderMatchupPanel(); // refresh score field to match the (possibly new) name(s)
  queueSave();
}

// side is 'a' or 'b' — the pair on that side of the court for this round.
// Both players on the pair receive the same score for this round (Americano-style).
function updateMatchupScore(courtIdx, side, value){
  ensureMatchupsShape();
  const m = state.matchups[editRound][courtIdx];
  const names = side==='a' ? [m.a1, m.a2] : [m.b1, m.b2];
  const score = Math.max(0, parseInt(value)||0);
  let touched = false;
  names.forEach(nameRaw=>{
    const name = (nameRaw||'').trim();
    if(!name) return;
    let team = findTeamByName(name);
    if(!team){
      team = {id: nextId++, name: name, scores: Array(state.rounds).fill(0)};
      state.teams.push(team);
    }
    team.scores[editRound] = score;
    touched = true;
  });
  if(!touched) return;
  render();
  if(document.getElementById('flash').classList.contains('show')) renderFlash();
  queueSave();
}

// Circle-method round robin: fixes one player and rotates the rest so that
// every possible pair of players ends up partnered exactly once across
// n-1 rounds (n = player count, padded with a bye if odd).
function generatePartnerRotation(players){
  let arr = [...players];
  if(arr.length % 2 === 1) arr.push(null); // null = bye slot
  const n = arr.length;
  const fixed = arr[0];
  let rotating = arr.slice(1);
  const rounds = [];
  for(let r=0; r<n-1; r++){
    const order = [fixed, ...rotating];
    const pairs = [];
    for(let i=0; i<n/2; i++){
      pairs.push([order[i], order[n-1-i]]);
    }
    rounds.push(pairs);
    rotating.unshift(rotating.pop());
  }
  return rounds; // n-1 rounds, each an array of [playerA, playerB] pairs
}

// Groups a round's partner-pairs two-at-a-time into courts (pair vs pair).
// If there's an odd pair left over, that pair sits out the round.
function pairsToCourts(pairs){
  const courts = [];
  for(let i=0; i+1<pairs.length; i+=2){
    const [a1,a2] = pairs[i];
    const [b1,b2] = pairs[i+1];
    courts.push({a1:a1||'', a2:a2||'', b1:b1||'', b2:b2||''});
  }
  return courts;
}

function shuffleArr(arr){
  const out = arr.slice();
  for(let i=out.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [out[i],out[j]] = [out[j],out[i]];
  }
  return out;
}

// Given the full sequence of rounds' partner-pairs (as produced by
// generatePartnerRotation, one entry per round), decides which pair faces
// which pair each round. Partners are already fixed by the rotation — this
// only chooses the pair-vs-pair matchups — aiming to (a) never repeat the
// exact same opponent in back-to-back rounds, (b) avoid repeating an
// opponent from two rounds ago where possible, and (c) spread opponents out
// as evenly as possible across the whole schedule. Uses randomized search:
// for each round it tries many random pairings of the round's teams and
// keeps the lowest-penalty one, then updates a running opponent history
// before moving to the next round.
function scheduleCourtsAvoidingRepeats(roundsPairs){
  const opponentCount = Object.create(null); // "playerA|||playerB" -> times faced
  let prevRoundKeys = new Set();
  let prevPrevRoundKeys = new Set();

  function oppKey(a,b){ return a < b ? a+'|||'+b : b+'|||'+a; }

  const scheduledRounds = [];

  for(const pairs of roundsPairs){
    const list = pairs.slice();
    let best = null;
    let bestScore = Infinity;
    const attempts = list.length <= 8 ? 250 : 450;

    for(let attempt=0; attempt<attempts; attempt++){
      const shuffled = shuffleArr(list);
      const matching = [];
      for(let i=0; i+1<shuffled.length; i+=2){
        matching.push([shuffled[i], shuffled[i+1]]);
      }

      let score = 0;
      for(const [pa,pb] of matching){
        const playersA = pa.filter(Boolean);
        const playersB = pb.filter(Boolean);
        for(const x of playersA){
          for(const y of playersB){
            const k = oppKey(x,y);
            const timesSoFar = opponentCount[k] || 0;
            score += timesSoFar * timesSoFar; // quadratic: spreads repeats out evenly
            if(prevRoundKeys.has(k)) score += 5000;      // hard: never repeat last round's opponent
            else if(prevPrevRoundKeys.has(k)) score += 150; // soft: try to avoid repeating from 2 rounds ago
          }
        }
      }

      if(score < bestScore){
        bestScore = score;
        best = matching;
        if(bestScore === 0) break;
      }
    }

    scheduledRounds.push(best || []);

    const thisRoundKeys = new Set();
    for(const [pa,pb] of best || []){
      const playersA = pa.filter(Boolean);
      const playersB = pb.filter(Boolean);
      for(const x of playersA){
        for(const y of playersB){
          const k = oppKey(x,y);
          opponentCount[k] = (opponentCount[k]||0) + 1;
          thisRoundKeys.add(k);
        }
      }
    }
    prevPrevRoundKeys = prevRoundKeys;
    prevRoundKeys = thisRoundKeys;
  }

  return scheduledRounds; // array of rounds, each an array of [pairA, pairB] matchups
}

function matchingToCourts(matching){
  return matching.map(([pa,pb])=>{
    const [a1,a2] = pa;
    const [b1,b2] = pb;
    return {a1:a1||'', a2:a2||'', b1:b1||'', b2:b2||''};
  });
}

// Auto-generates matchups from the team names already on the leaderboard —
// no separate name entry needed. Builds a full partner-rotation schedule so
// every player partners with every other player exactly once (Americano-style).
function autoGenerateMatchups(){
  const names = state.teams.map(t=>(t.name||'').trim()).filter(Boolean);
  const unique = [...new Set(names)];

  if(unique.length < names.length){
    alert('Two or more teams have the same name. Make each team name unique before auto-generating matchups.');
    return;
  }
  if(unique.length < 4){
    alert('Add at least 4 teams (use "+ Team") on the leaderboard before auto-generating matchups.');
    return;
  }
  const rotation = generatePartnerRotation(unique);
  const fullRounds = rotation.length; // rounds needed for a complete no-repeat rotation
  let neededCourts = Math.max(...rotation.map(pairs=>Math.floor(pairs.length/2)));
  let courtsTruncated = false;
  if(neededCourts > 8){ neededCourts = 8; courtsTruncated = true; }

  // Respect whatever round count is already set with the Round +/- stepper.
  // Only fall back to the full rotation length if rounds haven't been set at all.
  const roundsToUse = state.rounds || fullRounds;

  if(!confirm(`This will generate matchups for ${roundsToUse} round${roundsToUse===1?'':'s'} using a no-repeat partner rotation (a complete rotation for these players needs ${fullRounds} rounds), with courts matched up each round to also avoid repeat opponents where possible. Existing matchups will be replaced. Continue?`)) return;

  state.rounds = roundsToUse;
  state.courts = neededCourts;
  state.teams.forEach(t=>{
    while(t.scores.length < state.rounds) t.scores.push(0);
    while(t.scores.length > state.rounds) t.scores.pop();
  });
  ensureMatchupsShape();

  // Build the sequence of rounds' partner-pairs first (with wraparound if
  // extra rounds were requested beyond a full rotation), then let the
  // opponent-aware scheduler decide which pair faces which pair each round —
  // it looks across the whole sequence so it can avoid repeating the same
  // opponent in back-to-back (or near-consecutive) rounds.
  const roundsPairsSequence = [];
  for(let r=0; r<state.rounds; r++){
    // Wrap around if more rounds are requested than a full rotation covers —
    // combos will start repeating past round `fullRounds`.
    roundsPairsSequence.push(rotation[r % fullRounds]);
  }
  const scheduledRounds = scheduleCourtsAvoidingRepeats(roundsPairsSequence);

  for(let r=0; r<state.rounds; r++){
    const courts = matchingToCourts(scheduledRounds[r] || []);
    for(let c=0; c<state.courts; c++){
      state.matchups[r][c] = courts[c] || {a1:'',a2:'',b1:'',b2:''};
    }
  }

  render();
  renderMatchupPanel();
  queueSave();

  if(courtsTruncated){
    alert('Heads up: with this many players, fitting everyone needs more courts than the app supports (max 8), so some players will sit out each round.');
  } else if(roundsToUse < fullRounds){
    alert(`Generated ${roundsToUse} of ${fullRounds} rounds needed for a complete rotation — not every possible partnership will appear. Set Rounds to ${fullRounds} and regenerate for full coverage.`);
  } else if(roundsToUse > fullRounds){
    alert(`A complete no-repeat rotation only needs ${fullRounds} rounds — the extra rounds beyond that will start repeating partner combinations.`);
  } else if(unique.length % 4 !== 0){
    alert('Since the player count isn\'t a multiple of 4, a pair of players will sit out on some rounds to keep the rotation fair.');
  }
}

function toggleMatchupPanel(){
  const panel = document.getElementById('matchupPanel');
  const on = panel.style.display !== 'block';
  panel.style.display = on ? 'block' : 'none';
  if(on) renderMatchupPanel();
}

function teamName(id){
  const t = state.teams.find(t=>t.id===id);
  return t ? t.name : null;
}

// current score to show for a side: first matched player's score for editRound (both players
// on a pair always carry the same round score, since updateMatchupScore writes them together)
function scoreForSide(m, side){
  const names = side==='a' ? [m.a1, m.a2] : [m.b1, m.b2];
  for(const n of names){
    const team = findTeamByName(n);
    if(team) return team.scores[editRound];
  }
  return 0;
}

function updateCourtName(idx, value){
  ensureMatchupsShape();
  state.courtNames[idx] = value.trim() || ('Court ' + (idx+1));
  if(document.getElementById('flash').classList.contains('show')) renderFlash();
  queueSave();
}

function renderMatchupPanel(){
  ensureMatchupsShape();
  document.getElementById('editRoundLabel').textContent = 'Round ' + (editRound+1) + ' / ' + state.rounds;
  document.getElementById('courtCount').textContent = state.courts;
  const wrap = document.getElementById('courtRows');
  wrap.innerHTML = '';
  const esc = (s)=> String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  for(let c=0;c<state.courts;c++){
    const m = state.matchups[editRound][c] || {a1:'',a2:'',b1:'',b2:''};
    const row = document.createElement('div');
    row.className = 'courtrow';
    const scoreA = scoreForSide(m,'a');
    const scoreB = scoreForSide(m,'b');
    row.innerHTML = `
      <input type="text" class="courtlabel" value="${esc(state.courtNames[c])}"
        onchange="updateCourtName(${c},this.value)" />
      <div class="pairgroup">
        <input type="text" class="matchup-input" placeholder="Player 1"
          value="${esc(m.a1)}" onchange="updateMatchup(${c},'a1',this.value)" />
        <input type="text" class="matchup-input" placeholder="Player 2"
          value="${esc(m.a2)}" onchange="updateMatchup(${c},'a2',this.value)" />
      </div>
      <input type="number" min="0" class="matchup-score" value="${scoreA}"
        onchange="updateMatchupScore(${c},'a',this.value)" />
      <span class="vs">vs</span>
      <input type="number" min="0" class="matchup-score" value="${scoreB}"
        onchange="updateMatchupScore(${c},'b',this.value)" />
      <div class="pairgroup">
        <input type="text" class="matchup-input" placeholder="Player 1"
          value="${esc(m.b1)}" onchange="updateMatchup(${c},'b1',this.value)" />
        <input type="text" class="matchup-input" placeholder="Player 2"
          value="${esc(m.b2)}" onchange="updateMatchup(${c},'b2',this.value)" />
      </div>
    `;
    wrap.appendChild(row);
  }
}

function addTeam(){
  state.teams.push({id: nextId++, name:"New Team", scores: Array(state.rounds).fill(0)});
  render(); queueSave();
}
function removeTeam(id){
  state.teams = state.teams.filter(t=>t.id!==id);
  render(); queueSave();
}
function updateScore(id, idx, val){
  const t = state.teams.find(t=>t.id===id);
  t.scores[idx] = Math.max(0, parseInt(val)||0);
  render(); queueSave();
}
function updateName(id, val){
  const t = state.teams.find(t=>t.id===id);
  t.name = val; queueSave();
}
function resetBoard(){
  if(!confirm("Clear all teams and scores for this tournament?")) return;
  const fresh = {category: state.category, rounds: 5, courts: state.courts || 3, teams: [], matchups: [], courtNames: []};
  boards.tournaments[boards.activeId] = fresh;
  state = fresh;
  recalcNextId();
  ensureMatchupsShape();
  render(); queueSave();
}

function changeZoom(delta){
  zoom = Math.max(0.4, Math.min(2, Math.round((zoom+delta)*10)/10));
  document.getElementById('tvStage').style.zoom = zoom;
  document.getElementById('zoomLabel').textContent = Math.round(zoom*100) + '%';
}

function ranked(){
  return [...state.teams]
    .map(t=>({...t, total: t.scores.reduce((a,b)=>a+b,0)}))
    .sort((a,b)=> b.total - a.total);
}

function rankLabel(i){
  if(i===0) return "1ST";
  if(i===1) return "2ND";
  if(i===2) return "3RD";
  return String(i+1);
}
function medal(i){
  if(i===0) return "🥇";
  if(i===1) return "🥈";
  if(i===2) return "🥉";
  return "";
}

function render(){
  document.getElementById('category').value = state.category;
  document.getElementById('roundCount').textContent = state.rounds;

  const head = document.getElementById('headRow');
  head.innerHTML = '<th style="width:52px;">Rank</th><th class="teamcol">Team</th>';
  for(let r=0;r<state.rounds;r++){
    head.innerHTML += `<th>R${r+1}</th>`;
  }
  head.innerHTML += '<th style="width:70px;">Total</th><th class="editctrls" style="width:30px;"></th>';

  const list = ranked();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  list.forEach((t,i)=>{
    const tr = document.createElement('tr');
    tr.className = 'row' + (i<3 ? ' rank-'+(i+1) : '');
    let scoreCells = '';
    t.scores.forEach((s,idx)=>{
      scoreCells += `<td>
        <input class="score" type="number" min="0" value="${s}"
          onchange="updateScore(${t.id},${idx},this.value)" />
        <span class="score-display">${s}</span>
      </td>`;
    });
    tr.innerHTML = `
      <td class="rankcell"><span class="medal">${medal(i)}</span> ${rankLabel(i)}</td>
      <td>
        <input class="teamname" value="${t.name}" onchange="updateName(${t.id}, this.value)" />
      </td>
      ${scoreCells}
      <td class="total">${t.total}</td>
      <td class="editctrls"><button class="rmteam" onclick="removeTeam(${t.id})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function toggleTV(){
  document.body.classList.toggle('tv');
  const on = document.body.classList.contains('tv');
  document.getElementById('tvBtn').textContent = on ? 'Exit TV Mode' : 'TV Mode';
  if(document.documentElement.requestFullscreen && on){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else if(document.exitFullscreen && !on && document.fullscreenElement){
    document.exitFullscreen().catch(()=>{});
  }
  if(on){
    startTvIdleTimer();
  }else{
    clearTimeout(tvIdleTimer);
    document.body.classList.remove('controls-hidden');
  }
}

let tvIdleTimer = null;
function startTvIdleTimer(){
  clearTimeout(tvIdleTimer);
  document.body.classList.remove('controls-hidden');
  if(!document.body.classList.contains('tv')) return;
  // don't hide controls while a reveal/flash overlay is open
  const overlayOpen = document.getElementById('reveal').classList.contains('show')
                    || document.getElementById('flash').classList.contains('show');
  if(overlayOpen) return;
  tvIdleTimer = setTimeout(()=>{
    document.body.classList.add('controls-hidden');
  }, 5000);
}
['click','touchstart','keydown','pointerdown'].forEach(evt=>{
  document.addEventListener(evt, ()=>{
    if(document.body.classList.contains('tv')) startTvIdleTimer();
  });
});

/* ---- reveal mode ---- */
function startReveal(){
  const brandLogo = document.getElementById('brandLogo');
  const revealLogo = document.getElementById('revealLogo');
  if(brandLogo && revealLogo) revealLogo.src = brandLogo.src;
  document.getElementById('revealEventName').textContent = state.category;

  const list = ranked();
  const headRow = document.getElementById('revealHeadRow');
  headRow.innerHTML = '<th>Rank</th><th style="text-align:left;">Team</th>';
  for(let r=0;r<state.rounds;r++){
    headRow.innerHTML += `<th>R${r+1}</th>`;
  }
  headRow.innerHTML += '<th>Total</th>';

  const body = document.getElementById('revealBody');
  body.innerHTML = '';
  list.forEach((t,i)=>{
    const tr = document.createElement('tr');
    tr.className = i<3 ? 'top3 rank-'+(i+1) : '';
    let scoreCells = '';
    t.scores.forEach(s=>{ scoreCells += `<td class="score-cell">${s}</td>`; });
    tr.innerHTML = `
      <td class="reveal-rankcell">${medal(i)} ${rankLabel(i)}</td>
      <td class="reveal-name">${t.name}</td>
      ${scoreCells}
      <td class="reveal-total">${t.total}</td>
    `;
    body.appendChild(tr);
  });

  const reveal = document.getElementById('reveal');
  reveal.classList.remove('reveal-anim');
  void reveal.offsetWidth; // restart animation
  reveal.classList.add('show','reveal-anim');
  revealZoom = 1;
  document.getElementById('revealStage').style.transform = 'scale(1)';
}
function closeReveal(){
  document.getElementById('reveal').classList.remove('show');
}
let revealZoom = 1;
function adjustRevealZoom(delta){
  revealZoom = Math.min(2, Math.max(0.4, +(revealZoom + delta).toFixed(2)));
  document.getElementById('revealStage').style.transform = 'scale(' + revealZoom + ')';
}

document.addEventListener('keydown', (e)=>{
  if(document.getElementById('reveal').classList.contains('show')){
    if(e.key==='Escape') closeReveal();
  }
  if(document.getElementById('flash').classList.contains('show')){
    if(e.key==='ArrowRight' || e.key===' ') flashStep(1);
    if(e.key==='ArrowLeft') flashStep(-1);
    if(e.key==='Escape') closeFlash();
  }
});

/* ---- flash matchups (who's on which court, per round) ---- */
function openFlash(){
  ensureMatchupsShape();
  flashRound = editRound;
  const brandLogo = document.getElementById('brandLogo');
  const flashLogo = document.getElementById('flashLogo');
  if(brandLogo && flashLogo) flashLogo.src = brandLogo.src;
  document.getElementById('flashEventName').textContent = state.category;
  document.getElementById('flash').classList.add('show');
  flashZoomLevel = 1;
  document.getElementById('flashCourts').style.zoom = 1;
  renderFlash();
  showFlashControls();
}
function adjustFlashZoom(delta){
  flashZoomLevel = Math.min(2, Math.max(0.4, +(flashZoomLevel + delta).toFixed(2)));
  document.getElementById('flashCourts').style.zoom = flashZoomLevel;
}
function closeFlash(){
  document.getElementById('flash').classList.remove('show');
  clearTimeout(flashHideTimer);
}
let flashHideTimer = null;
function showFlashControls(){
  const controls = document.getElementById('flashControls');
  const zoom = document.getElementById('flashZoom');
  controls.classList.remove('controls-hidden');
  zoom.classList.remove('controls-hidden');
  clearTimeout(flashHideTimer);
  flashHideTimer = setTimeout(()=>{
    controls.classList.add('controls-hidden');
    zoom.classList.add('controls-hidden');
  }, 3000);
}
document.getElementById('flash').addEventListener('click', showFlashControls);
function flashStep(dir){
  flashRound = Math.max(0, Math.min(state.rounds-1, flashRound+dir));
  renderFlash();
}
function pairLabel(n1, n2){
  const names = [n1, n2].map(n=>(n||'').trim()).filter(Boolean);
  return names.length ? names.join(' & ') : '—';
}
function pairScoreFor(n1, n2, roundIdx){
  const names = [n1, n2];
  for(const n of names){
    const team = findTeamByName(n);
    if(team) return team.scores[roundIdx];
  }
  return null;
}

function renderFlash(){
  ensureMatchupsShape();
  document.getElementById('flashRoundLabel').textContent = 'ROUND ' + (flashRound+1);
  const wrap = document.getElementById('flashCourts');
  wrap.innerHTML = '';
  const courts = state.matchups[flashRound] || [];
  courts.forEach((m,idx)=>{
    const a = pairLabel(m.a1, m.a2);
    const b = pairLabel(m.b1, m.b2);
    const scoreA = pairScoreFor(m.a1, m.a2, flashRound);
    const scoreB = pairScoreFor(m.b1, m.b2, flashRound);
    const card = document.createElement('div');
    card.className = 'flashcard';
    card.innerHTML = `
      <div class="flashcourt">${(state.courtNames[idx]||('COURT '+(idx+1))).toUpperCase()}</div>
      <div class="flashpair">
        <span>${a}</span>${scoreA!==null ? `<span class="flashscore">${scoreA}</span>` : ''}
        <span class="flashvs">vs</span>
        ${scoreB!==null ? `<span class="flashscore">${scoreB}</span>` : ''}<span>${b}</span>
      </div>
    `;
    wrap.appendChild(card);
  });
  const stage = document.querySelector('.flashstage');
  stage.classList.remove('flash-anim');
  void stage.offsetWidth;
  stage.classList.add('flash-anim');
}

loadState();
</script>
</body>
</html>
